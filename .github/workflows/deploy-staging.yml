# نشر staging: يدوي فقط، ويتطلب موافقة بيئة "staging" (Required reviewers) وأسرارًا تضبطها أنت.
# لا يعمل تلقائيًا ولا يمس production. إن لم تُضبط الأسرار يفشل مبكرًا بلا أي اتصال.
name: Deploy staging (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "اكتب STAGING للتأكيد"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'STAGING' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Check secrets
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          PATH_: ${{ secrets.STAGING_APP_PATH }}
        run: |
          for v in HOST USER KEY PATH_; do if [ -z "${!v}" ]; then echo "السر $v غير مضبوط في بيئة staging"; exit 1; fi; done
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "pdo_mysql, mbstring, zip" }
      - run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: backend
      - name: Rsync over SSH (بدون FTP)
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          rsync -az --delete --exclude '.env' --exclude 'storage/' --exclude 'tests/' --exclude '.git' \
            -e "ssh -i key -o StrictHostKeyChecking=accept-new" backend/ \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:${{ secrets.STAGING_APP_PATH }}/"
          ssh -i key -o StrictHostKeyChecking=accept-new "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" "cd ${{ secrets.STAGING_APP_PATH }} && php bin/migrate.php"
