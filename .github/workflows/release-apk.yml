# إصدار APK موقّع: يدوي، ببيئة "production" (موافقة مطلوبة) وأسرار التوقيع. لا يعمل بدونها.
name: Release signed APK (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "اكتب RELEASE للتأكيد"
        required: true

permissions:
  contents: read

jobs:
  release:
    if: ${{ inputs.confirm == 'RELEASE' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS_B64" ] || { echo "RELEASE_KEYSTORE_BASE64 غير مضبوط"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Firebase config (اختياري)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: '[ -z "$GS" ] || printf "%s" "$GS" > android/app/google-services.json'
      - name: Build release
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          FLEET_DEFAULT_SERVER_URL: ${{ vars.FLEET_DEFAULT_SERVER_URL }}
        run: ./gradlew :core:test :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-driver-release-apk
          path: android/app/build/outputs/apk/release/*.apk
