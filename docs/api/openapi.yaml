openapi: 3.0.3
info:
  title: Fleet & Movement Management API
  version: 1.0.0
  description: |
    واجهة REST لتطبيق السائق ولوحة الإدارة. كل المسارات تحت `/api/v1`.
    - **تطبيق السائق:** `Authorization: Bearer <access_token>` (من `/auth/login`).
    - **واجهة الإدارة (`/admin/*`):** جلسة المتصفح + ترويسة `X-CSRF-Token` لطلبات التعديل.
    - **الأخطاء موحدة:** `{ "error": { "code", "message", "details" } }`.
    - **Idempotency:** أحداث المزامنة بـ `event_id`، ونقاط GPS بـ `id` (لكل رحلة).
servers:
  - url: https://example.invalid/api/v1
    description: استبدل بعنوان الخادم الفعلي (HTTPS فقط)
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    session: { type: apiKey, in: cookie, name: fleet_sid }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, details: { type: object } }
    SyncEvent:
      type: object
      required: [event_id, type, payload]
      properties:
        event_id: { type: string, maxLength: 64, description: معرف فريد من العميل (UUID) }
        type:
          type: string
          enum: [mission.delivered, mission.accept, mission.reject, mission.arrive, mission.complete, odometer.record, vehicle.switch, trip.close, stop.explain, deviation.explain, sos.create, inspection.submit]
        client_ts: { type: string, format: date-time, description: وقت الحدث الأصلي على الجهاز }
        payload: { type: object }
    SyncResult:
      type: object
      properties:
        event_id: { type: string }
        status: { type: string, enum: [applied, duplicate, conflict, rejected, retry] }
        data: { type: object }
        error: { $ref: '#/components/schemas/Error/properties/error' }
        server_mission: { type: object, description: حالة المهمة على الخادم عند التعارض }
    GpsPoint:
      type: object
      required: [id, ts, lat, lon]
      properties:
        id: { type: string, maxLength: 64 }
        ts: { type: string, format: date-time }
        lat: { type: number }
        lon: { type: number }
        accuracy: { type: number }
        speed: { type: number }
        bearing: { type: number }
        source: { type: string, enum: [gps, network, fused, manual] }
  responses:
    Error:
      description: خطأ
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
security: [{ bearer: [] }]
paths:
  /auth/login:
    post:
      security: []
      summary: دخول السائق (يصدر access + refresh)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, device_id]
              properties: { username: {type: string}, password: {type: string}, device_id: {type: string}, device_label: {type: string}, push_token: {type: string}, mfa_code: {type: string} }
      responses:
        '200': { description: تم }
        '401': { $ref: '#/components/responses/Error' }
        '423': { description: الحساب مقفل مؤقتًا }
        '429': { description: تجاوز حد المعدل }
  /auth/refresh:
    post:
      security: []
      summary: تجديد الرموز (تدوير؛ إعادة استخدام رمز قديم تبطل الجهاز)
      responses: { '200': { description: تم }, '401': { $ref: '#/components/responses/Error' } }
  /auth/logout: { post: { summary: إبطال رمز الوصول, responses: { '200': { description: تم } } } }
  /auth/change-password: { post: { summary: تغيير كلمة المرور (يبطل كل الرموز), responses: { '200': { description: تم } } } }
  /me: { get: { summary: بيانات السائق, responses: { '200': { description: تم } } } }
  /config: { get: { summary: إعدادات التطبيق (فواصل GPS، أسباب التوقف، ميزات), responses: { '200': { description: تم } } } }
  /missions:
    get: { summary: مهام السائق فقط (غير المسودة), parameters: [{ name: closed_days, in: query, schema: { type: integer, maximum: 30 } }], responses: { '200': { description: قائمة المهام + حالة الرحلة } } }
  /missions/{id}:
    get: { summary: مهمة للسائق (404 لمهام الآخرين), parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم }, '404': { $ref: '#/components/responses/Error' } } }
  /sync/events:
    post:
      summary: دفعة أحداث idempotent (حتى 200). الأولوية SOS ثم قرارات المهام ثم الباقي.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, items: { $ref: '#/components/schemas/SyncEvent' } } } } } }
      responses:
        '200':
          description: نتيجة لكل حدث
          content: { application/json: { schema: { type: object, properties: { results: { type: array, items: { $ref: '#/components/schemas/SyncResult' } }, trip: { type: object, nullable: true }, server_time: { type: string } } } } }
  /gps/batch:
    post:
      summary: دفعة نقاط GPS (حتى 500). التكرار يُتجاهل بالمعرف.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [client_trip_id, points], properties: { client_trip_id: { type: string }, points: { type: array, items: { $ref: '#/components/schemas/GpsPoint' } } } } } }
      responses: { '200': { description: "{accepted,duplicates,rejected[],tracking_required}" }, '404': { description: الرحلة غير معروفة (زامن القبول أولًا) } }
  /trips/current: { get: { summary: حالة الرحلة المفتوحة, responses: { '200': { description: تم } } } }
  /trips/current/pending: { get: { summary: توقفات/انحرافات بانتظار التفسير, responses: { '200': { description: تم } } } }
  /attachments:
    post:
      summary: رفع صورة (JPEG/PNG/WebP ≤ 8MB) مع sha256 للتحقق
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, owner_type, owner_ref, client_file_id]
              properties:
                file: { type: string, format: binary }
                owner_type: { type: string, enum: [mission_proof, odometer, emergency, inspection] }
                owner_ref: { type: string, description: "معرف المهمة، أو event_id للعداد/SOS/الفحص" }
                client_file_id: { type: string }
                sha256: { type: string }
                captured_at: { type: string, format: date-time }
      responses: { '201': { description: وصل وتم التحقق }, '200': { description: مكرر }, '404': { description: العنصر المرتبط لم يصل بعد }, '415': { description: نوع غير مدعوم }, '422': { description: فشل checksum } }
  /attachments/{id}/file: { get: { summary: تنزيل مرفق (صاحبه فقط), parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: الصورة }, '404': { $ref: '#/components/responses/Error' } } } }
  /notifications: { get: { summary: إشعارات السائق, responses: { '200': { description: تم } } } }
  /notifications/{id}/read: { post: { summary: تعليم كمقروء, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم } } } }
  /devices/push-token: { post: { summary: تحديث رمز Push, responses: { '200': { description: تم } } } }
  /emergencies/{id}: { get: { summary: حالة بلاغ السائق وتحديثاته, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم }, '404': { $ref: '#/components/responses/Error' } } } }
  /history: { get: { summary: سجل السائق الشخصي, responses: { '200': { description: تم } } } }
  /webhooks/sms-dlr: { post: { security: [], summary: "تقرير تسليم SMS (ترويسة X-Webhook-Secret)", responses: { '200': { description: تم } } } }
  /webhooks/sms-inbound: { post: { security: [], summary: "SOS احتياطي عبر SMS: SOS|event_id|lat|lon|unix_ts (التسليم غير مضمون)", responses: { '200': { description: تم } } } }
  /admin/live: { get: { security: [{ session: [] }], summary: "المركبات النشطة؛ is_live=false عند قدم الموقع", description: "يتطلب tracking.view_live", responses: { '200': { description: تم } } } }
  /admin/dashboard: { get: { security: [{ session: [] }], summary: مؤشرات اللوحة ضمن النطاق, responses: { '200': { description: تم } } } }
  /admin/trips/{id}/track: { get: { security: [{ session: [] }], summary: "مسار تاريخي (tracking.view_history) ويُدقق", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم }, '403': { $ref: '#/components/responses/Error' } } } }
  /admin/missions:
    get: { security: [{ session: [] }], summary: "قائمة المهام (pagination: page, per_page ≤ 100؛ مرشحات: status, driver_id, vehicle_id, priority, from, to, q)", responses: { '200': { description: "{data, meta}" } } }
    post: { security: [{ session: [] }], summary: إنشاء مهمة (missions.create), responses: { '201': { description: تم }, '422': { $ref: '#/components/responses/Error' } } }
  /admin/missions/{id}:
    get: { security: [{ session: [] }], summary: تفاصيل + سجل أحداث, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم } } }
    put: { security: [{ session: [] }], summary: تعديل (missions.update), parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم } } }
  /admin/missions/{id}/assign: { post: { security: [{ session: [] }], summary: "إسناد سائق/مركبة؛ 409 vehicle_conflict ما لم يُرسل conflict_exception_reason", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم }, '409': { $ref: '#/components/responses/Error' } } } }
  /admin/missions/{id}/send: { post: { security: [{ session: [] }], summary: إرسال للسائق, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم } } } }
  /admin/missions/{id}/cancel: { post: { security: [{ session: [] }], summary: إلغاء بسبب إلزامي, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم } } } }
  /admin/missions/{id}/routes: { post: { security: [{ session: [] }], summary: "اقتراح مسار (auto عبر مزود Routing أو manual بهندسة)", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: تم } } } }
  /admin/routes/{id}/approve: { post: { security: [{ session: [] }], summary: اعتماد مسار (يُدقق), parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم } } } }
  /admin/emergencies: { get: { security: [{ session: [] }], summary: قائمة البلاغات ضمن النطاق, responses: { '200': { description: تم } } } }
  /admin/emergencies/{id}: { get: { security: [{ session: [] }], summary: تفاصيل البلاغ والإجراءات والتصعيد, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم } } } }
  /admin/emergencies/{id}/acknowledge: { post: { security: [{ session: [] }], summary: تأكيد الاستلام, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم } } } }
  /admin/emergencies/{id}/assign: { post: { security: [{ session: [] }], summary: تعيين مسؤول متابعة, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم } } } }
  /admin/emergencies/{id}/actions: { post: { security: [{ session: [] }], summary: تسجيل إجراء/اتصال, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: تم } } } }
  /admin/emergencies/{id}/updates: { post: { security: [{ session: [] }], summary: تحديث يظهر للسائق, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: تم } } } }
  /admin/emergencies/{id}/status: { post: { security: [{ session: [] }], summary: تغيير الحالة, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم } } } }
  /admin/emergencies/{id}/close: { post: { security: [{ session: [] }], summary: إغلاق بسبب إلزامي أو إنذار خاطئ, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم } } } }
  /admin/segments/{id}/odometer: { post: { security: [{ session: [] }], summary: "إدخال إداري/استثناء انخفاض العداد (odometer.override + سبب)", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: تم } } } }
  /admin/deviations/{id}/review: { post: { security: [{ session: [] }], summary: مراجعة انحراف, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: تم } } } }
  /admin/attachments/{id}/file: { get: { security: [{ session: [] }], summary: "عرض مرفق بصلاحية ونطاق (يُدقق)", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: الصورة } } } }
